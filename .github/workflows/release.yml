name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            ext: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross (static Linux builds, incl. bundled SQLite)
        if: matrix.use_cross
        uses: taiki-e/install-action@cross
      - name: Build
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --bin tokenloom --target ${{ matrix.target }}
          else
            cargo build --release --bin tokenloom --target ${{ matrix.target }}
          fi

      - name: Stage archive (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE="tokenloom-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$STAGE/integrations"
          cp "target/${{ matrix.target }}/release/tokenloom" "dist/$STAGE/"
          cp -R integrations/dsh-plugin "dist/$STAGE/integrations/"
          cp README.md LICENSE "dist/$STAGE/" 2>/dev/null || cp README.md "dist/$STAGE/"
          tar -czf "dist/tokenloom-$VERSION-${{ matrix.target }}.tar.gz" -C dist "$STAGE"
          ( cd dist && sha256sum "tokenloom-$VERSION-${{ matrix.target }}.tar.gz" \
              > "tokenloom-$VERSION-${{ matrix.target }}.tar.gz.sha256" )

      - name: Stage archive (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME
          $STAGE = "tokenloom-$VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$STAGE/integrations" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tokenloom.exe" "dist/$STAGE/"
          Copy-Item -Recurse "integrations/dsh-plugin" "dist/$STAGE/integrations/"
          Copy-Item "README.md" "dist/$STAGE/"
          Compress-Archive -Path "dist/$STAGE" -DestinationPath "dist/tokenloom-$VERSION-${{ matrix.target }}.zip"
          $hash = (Get-FileHash "dist/tokenloom-$VERSION-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  tokenloom-$VERSION-${{ matrix.target }}.zip" | Out-File "dist/tokenloom-$VERSION-${{ matrix.target }}.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
