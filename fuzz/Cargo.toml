[package]
name = "tokenloom-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.tokenloom-sanitize]
path = "../crates/tokenloom-sanitize"

[dependencies.tokenloom-fetch]
path = "../crates/tokenloom-fetch"

# Keep this crate outside the parent workspace (cargo-fuzz builds it itself).
[workspace]

[[bin]]
name = "fuzz_sanitizer"
path = "fuzz_targets/fuzz_sanitizer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ssrf_resolver"
path = "fuzz_targets/fuzz_ssrf_resolver.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_spa_detector"
path = "fuzz_targets/fuzz_spa_detector.rs"
test = false
doc = false
bench = false
