[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Dane Walker"]
repository = "https://github.com/danecwalker/tokenloom"
description = "Fast, safe, token-efficient Rust CLI for web search and page fetching, built for LLMs and AI agent pipelines"

[workspace.dependencies]
# Async runtime & HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "gzip",
    "brotli",
    "zstd",
    "json",
] }
hickory-resolver = "0.24"

# CLI & serialization
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"

# Sanitiser pipeline
ammonia = "4"
lol_html = "1.2"
scraper = "0.20"
dom_smoothie = "0.18"
htmd = "0.5"
encoding_rs = "0.8"
chardetng = "0.1"
unicode-normalization = "0.1"
roxmltree = "0.20"

# Rate limiting, cache, rendering
governor = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

# Errors, logging, text
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev / testing
wiremock = "0.6"
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 4
